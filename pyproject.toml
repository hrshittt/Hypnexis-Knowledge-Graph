[project]
name = "ceo-digital-twin"
version = "3.0.0"
description = "Interactive Knowledge Base (topic-augmented knowledge graph builder) + agentic RAG CEO Digital Twin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.3.6",
    "langchain>=1.1.3",
    "langchain-community>=0.4.1",
    "langchain-core>=1.1.3",
    "google-genai>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=5.2.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "loguru>=0.7.2",
    "rank-bm25>=0.2.2",
    "langgraph>=1.0.2",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "slowapi>=0.1.9",
    "networkx>=3.2",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
neo4j = ["neo4j>=5.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

